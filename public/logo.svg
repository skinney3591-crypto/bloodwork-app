<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- markr text -->
  <text x="10" y="30" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#1E293B" letter-spacing="-0.5">markr</text>

  <!-- Dot pattern above the 'a' - representing biomarkers/data points -->
  <circle cx="44" cy="8" r="1.5" fill="#2563EB"/>
  <circle cx="49" cy="6" r="1.5" fill="#2563EB"/>
  <circle cx="54" cy="8" r="1.5" fill="#2563EB"/>
  <circle cx="49" cy="10" r="1.5" fill="#2563EB" opacity="0.6"/>

  <!-- Subtle connecting lines to show data relationship -->
  <line x1="44" y1="8" x2="49" y2="6" stroke="#2563EB" stroke-width="0.5" opacity="0.3"/>
  <line x1="49" y1="6" x2="54" y2="8" stroke="#2563EB" stroke-width="0.5" opacity="0.3"/>
</svg>
